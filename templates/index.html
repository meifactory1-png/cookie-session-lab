<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠키 & 세션 보안 실험실</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#101827;color:#e8eef9;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);background:#1b2940;border:1px solid #34445f;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}
    h1{margin-top:0;font-size:clamp(25px,5vw,36px)} p{line-height:1.7;color:#c5d1e4}
    .notice{background:#2a3548;border-left:4px solid #61c69a;padding:12px 15px;border-radius:8px}
    .buttons{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
    button{border:0;border-radius:9px;padding:12px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#75d6ac;color:#10251d}
    button.secondary{background:#425674;color:#fff}
    #result{white-space:pre-wrap;background:#101827;border-radius:10px;padding:16px;min-height:64px;color:#bfead6}
    small{color:#9eafc7}
  </style>
</head>
<body>
<main>
  <h1>🍪 쿠키 & 세션 보안 실험실</h1>
  <p>실제 계정에 로그인하지 않고, 서버가 발급한 <b>가짜 세션 쿠키</b>로 웹 세션의 작동 원리를 체험하는 교육용 데모입니다.</p>
  <div class="notice">안전 설계: 실제 서비스 쿠키나 비밀번호를 수집하지 않습니다. 데모 쿠키는 HttpOnly 속성으로 JavaScript 접근을 차단합니다.</div>
  <div class="buttons">
    <button id="start">체험 시작 (가짜 쿠키 발급)</button>
    <button id="check" class="secondary">내 세션 확인</button>
    <button id="logout" class="secondary">세션 종료</button>
  </div>
  <div id="result" role="status">버튼을 눌러 체험을 시작하세요.</div>
  <p><small>참고: HttpOnly는 브라우저 스크립트의 쿠키 읽기를 제한합니다. HTTPS, SameSite, 적절한 세션 만료 및 서버 측 보호도 중요합니다.</small></p>
</main>
<script>
const out=document.getElementById('result');
async function call(path,method='GET'){
  try{
    const r=await fetch(path,{method,credentials:'same-origin'});
    const data=await r.json();
    out.textContent=data.message || JSON.stringify(data);
  }catch(e){out.textContent='요청에 실패했어요. 잠시 후 다시 시도해 주세요.';}
}
document.getElementById('start').addEventListener('click',()=>call('/login-demo','POST'));
document.getElementById('check').addEventListener('click',()=>call('/check'));
document.getElementById('logout').addEventListener('click',()=>call('/logout','POST'));
</script>
</body>
</html>
